version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
      - mkdir -p .pip_cache
      - cache restore
      - pip install --cache-dir .pip_cache -r requirements.txt
      - 'export PATH=$PATH:/home/semaphore/.local/bin'
blocks:
  - name: Install Dependencies
    dependencies: []
    task:
      jobs:
        - name: 'Job #1'
          commands:
            - cache restore
            - pip install --cache-dir .pip_cache -r requirements.txt
            - cache store
  - name: Unit
    dependencies:
      - Install Dependencies
    task:
      jobs:
        - name: TDD
          commands:
            - cd 1-tdd
            - pytest
        - name: UNIT
          commands:
            - cd 2-unit-testing
            - pytest test_math_sum.py -v
  - name: Integration
    dependencies:
      - Unit
    task:
      jobs:
        - name: INT
          commands:
            - cd 3-integration-testing && python -m pytest test_integration.py -v
        - name: MOCK
          commands:
            - cd 6-mocking && python -m pytest test_weather_service.py -v
        - name: DB
          commands:
            - cd 10-database-testing && python -m pytest test_database.py -v
