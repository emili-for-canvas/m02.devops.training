version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
      - cache restore venv
      - FILE=".venv/vin/activate"
      - 'if [ -f "$FILE" ]; then'
      - echo "File exists (any type)."
      - source $FILE
      - fi
blocks:
  - name: Install Dependencies
    dependencies: []
    task:
      jobs:
        - name: 'Job #1'
          commands:
            - python -m venv .venv
            - source .venv/bin/activate
            - pip install pytest requests flask coverage locust
            - cache store venv .venv
  - name: Unit
    dependencies:
      - Install Dependencies
    task:
      jobs:
        - name: 'Job #1'
          commands:
            - cd 1-tdd
            - pytest
            - cd 2-unit-testing && python -m pytest test_math_sum.py -v
